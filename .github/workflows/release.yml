name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release -p luavm

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="dist/luavm-${{ matrix.name }}"
          mkdir -p "$package"
          cp target/release/luavm "$package/luavm"
          cp README.md LICENSE "$package/"
          tar -czf "dist/luavm-${{ matrix.name }}.tar.gz" -C dist "luavm-${{ matrix.name }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/luavm-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item target/release/luavm.exe "$package/luavm.exe"
          Copy-Item README.md, LICENSE $package
          Compress-Archive -Path "$package/*" -DestinationPath "dist/luavm-${{ matrix.name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum *.tar.gz *.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/* --generate-notes
