name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    steps:
      - name: Configure Windows checkout line endings
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.autocrlf input

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install nextest and cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.20.2

      - name: Set up Windows source-build toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: mingw-w64-ucrt-x86_64-toolchain

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Tests (nextest)
        run: cargo nextest run --profile ci --workspace

      - name: Run Documentation Tests
        run: cargo test --workspace --doc

      - name: Check Layer Hierarchy
        run: cargo run -p xtask -- layers
        if: always()

      - name: Check source-build prerequisites (Unix)
        if: runner.os != 'Windows'
        run: cargo run --locked -p luavm -- doctor --json

      - name: Check source-build prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo run --locked -p luavm -- doctor --json

      - name: Build official Lua source (Unix)
        if: runner.os != 'Windows'
        env:
          LUAVM_DATA_ROOT: ${{ runner.temp }}/luavm-source-smoke
        run: |
          cargo run --locked -p luavm -- install 5.4.8 --no-prerequisites
          cargo run --locked -p luavm -- exec 5.4.8 -- lua -v

      - name: Build official Lua source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LUAVM_DATA_ROOT: ${{ runner.temp }}/luavm-source-smoke
        run: |
          cargo run --locked -p luavm -- install 5.4.8 --no-prerequisites
          cargo run --locked -p luavm -- exec 5.4.8 -- lua -v

      - name: Cargo Deny (Licenses & Advisories)
        run: cargo deny check
        if: runner.os == 'Linux'
